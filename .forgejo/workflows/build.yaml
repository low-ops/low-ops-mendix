# Mendix build. Tekton pipeline: mx-app-build-custom.
# The build job pushes harbor/<REGISTRY>/apps-<repo>/app:<branch>-<shortsha>.
# Deploy uses that image. lint and unit-test can be deleted.
# Org variables: REGISTRY, TOOLKIT_IMAGE, ROOTFS_APP_IMAGE, ROOTFS_BUILDER_IMAGE
# Org secrets: HARBOR_USERNAME, HARBOR_PASSWORD, UNIT_TEST_PASSWORD
# The runner starts the Mendix images and mounts this job's checkout into them.
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: lowops
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          base="${SERVER%/}"
          case "$base" in
            https://*) origin="https://oauth2:${TOKEN}@${base#https://}" ;;
            http://*) origin="http://oauth2:${TOKEN}@${base#http://}" ;;
            *) origin="http://oauth2:${TOKEN}@${base}" ;;
          esac
          git init .
          git remote add origin "${origin}/${REPO}.git"
          git fetch --depth 1 origin "$SHA"
          git checkout FETCH_HEAD

      - name: Write metadata command
        run: |
          set -eu
          cat > meta.sh <<'EOF'
          #!/bin/sh
          set -eu
          /opt/mendix/bin/mxpc-pipeline-tools-cli mx-app-ver . > version.txt
          /opt/mendix/bin/mxpc-pipeline-tools-cli mx-app-mpr-path . > mpr.txt
          chmod a+r version.txt mpr.txt
          EOF
          chmod +x meta.sh

      - name: Read Mendix metadata
        uses: docker://private-cloud.registry.mendix.com/mxpc-pipeline-tools-cli:0.0.6
        with:
          entrypoint: /bin/sh
          args: ./meta.sh

      - name: Metadata
        id: meta
        run: |
          set -eu
          version=$(cat version.txt)
          mpr=$(cat mpr.txt)
          short=$(printf '%s' "${{ github.sha }}" | cut -c1-7)
          tag=$(printf '%s' "${{ github.ref_name }}-${short}" | sed 's/%20/_/g' | tr -cd '[:alnum:]_.-' | sed 's/^[.-]*//' | cut -c -128)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mpr=${mpr}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          rm -f meta.sh version.txt mpr.txt

      - name: Write compile command
        run: |
          set -eu
          cat > compile.sh <<EOF
          #!/bin/sh
          set -eu
          export BUILD_PATH=.
          export MPR_FILE_PATH='${{ steps.meta.outputs.mpr }}'
          /opt/mendix/compile.sh
          chmod -R a+rX .
          EOF
          chmod +x compile.sh

      - name: Compile MDA
        uses: docker://private-cloud.registry.mendix.com/mxbuild:${{ steps.meta.outputs.version }}
        with:
          entrypoint: /bin/sh
          args: ./compile.sh

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          APP: ${{ github.event.repository.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          ROOTFS_APP: ${{ vars.ROOTFS_APP_IMAGE }}
          ROOTFS_BUILDER: ${{ vars.ROOTFS_BUILDER_IMAGE }}
        run: |
          set -eu
          rm -f compile.sh
          mda=$(find . -name '*.mda' | head -n 1)
          test -n "$mda"
          mkdir -p project scripts
          unzip "$mda" -d ./project
          cp -r /app/buildpack/scripts/* ./scripts/
          if [ -f Dockerfile ]; then
            dockerfile="$PWD/Dockerfile"
          else
            dockerfile=/app/buildpack/Dockerfile
          fi
          mkdir -p /kaniko/.docker
          auth=$(printf '%s:%s' "$HARBOR_USERNAME" "$HARBOR_PASSWORD" | base64 | tr -d '\n')
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$auth" > /kaniko/.docker/config.json
          image="${REGISTRY}/apps-${APP}/app:${TAG}"
          /kaniko/executor \
            --context "$PWD" \
            --dockerfile "$dockerfile" \
            --destination "$image" \
            --build-arg "ROOTFS_IMAGE=${ROOTFS_APP}" \
            --build-arg "BUILDER_ROOTFS_IMAGE=${ROOTFS_BUILDER}" \
            --ignore-path=/var/mail \
            --ignore-path=/var/spool/mail \
            --ignore-path=//product_uuid \
            --cleanup
          echo "image=${image}" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: lowops
    continue-on-error: true
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          base="${SERVER%/}"
          case "$base" in
            https://*) origin="https://oauth2:${TOKEN}@${base#https://}" ;;
            http://*) origin="http://oauth2:${TOKEN}@${base#http://}" ;;
            *) origin="http://oauth2:${TOKEN}@${base}" ;;
          esac
          git init .
          git remote add origin "${origin}/${REPO}.git"
          git fetch --depth 1 origin "$SHA"
          git checkout FETCH_HEAD
      - name: mxlint
        run: |
          set -eu
          cp -r /app/rules .
          mxlint export-model
          mxlint lint --json-file=report.json

  unit-test:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Unit test
        env:
          MXRUNTIME_DatabaseType: HSQLDB
          MXRUNTIME_DatabaseName: testing
          MXRUNTIME_DatabaseJdbcUrl: jdbc:hsqldb:mem:testing
          NON_MENDIX_PUBLIC_CLOUD: "true"
          MX_UnitTesting_Enabled: "true"
          MX_UnitTesting_RemoteApiEnabled: "true"
          MX_UnitTesting_RemoteApiPassword: ${{ secrets.UNIT_TEST_PASSWORD }}
        run: |
          set -eu
          cd /opt/mendix/build
          ./startup.py &
          python ./mx-app-unit-test-caller.py \
            --api-password "$MX_UnitTesting_RemoteApiPassword" \
            --json-file /tmp/results.json

  scan:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: aquasec/trivy:0.63.0
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: Trivy
        run: trivy image --format json --output scan-result.json --timeout 15m "${{ needs.build.outputs.image }}"
