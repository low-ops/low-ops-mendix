# Mendix build. Tekton pipeline: mx-app-build-custom.
# CI scripts live in .forgejo/scripts/
# Org variables: REGISTRY, TOOLKIT_IMAGE, ROOTFS_APP_IMAGE, ROOTFS_BUILDER_IMAGE, RABBITMQ_HOST, MINIO_URL, CORE_BUCKET
# Org secrets: HARBOR_USERNAME, HARBOR_PASSWORD, UNIT_TEST_PASSWORD, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, MINIO_ACCESS_KEY, MINIO_SECRET_KEY
on:
  push:
    branches: [main]

x-repo-checkout: &repo-checkout |
  set -eu
  if [ -n "${APT_PACKAGES:-}" ]; then
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends ${APT_PACKAGES}
  fi
  if [ -n "${APK_PACKAGES:-}" ]; then
    apk add --no-cache ${APK_PACKAGES}
  fi
  base="${SERVER%/}"
  case "$base" in
    https://*) origin="https://oauth2:${TOKEN}@${base#https://}" ;;
    http://*) origin="http://oauth2:${TOKEN}@${base#http://}" ;;
    *) origin="http://oauth2:${TOKEN}@${base}" ;;
  esac
  git init .
  git remote add origin "${origin}/${REPO}.git"
  git fetch --depth 1 origin "$SHA"
  git checkout FETCH_HEAD

jobs:
  build:
    runs-on: lowops
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
      volumes:
        - /srv/shared:/srv/shared
    outputs:
      image: ${{ steps.image.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      correlation: ${{ steps.open.outputs.correlation }}
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: *repo-checkout

      - name: Register build
        id: open
        env:
          APP: ${{ github.event.repository.name }}
          COMMIT: ${{ github.sha }}
          REQUESTER: user/${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
        run: python .forgejo/scripts/register_build.py

      - name: Stage CI scripts for later jobs
        env:
          CORRELATION: ${{ steps.open.outputs.correlation }}
        run: |
          set -eu
          mkdir -p "/srv/shared/${CORRELATION}/ci"
          cp .forgejo/scripts/mx_app_unit_test_caller.py "/srv/shared/${CORRELATION}/ci/"
          cp .forgejo/scripts/unit_test.sh "/srv/shared/${CORRELATION}/ci/"
          chmod +x "/srv/shared/${CORRELATION}/ci/unit_test.sh"

      - name: Prepare Mendix metadata script
        run: bash .forgejo/scripts/prepare_meta.sh

      - name: Read Mendix metadata
        uses: docker://private-cloud.registry.mendix.com/mxpc-pipeline-tools-cli:0.0.6
        with:
          entrypoint: /bin/sh
          args: ./meta.sh

      - name: Metadata
        id: meta
        env:
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: bash .forgejo/scripts/read_metadata_outputs.sh

      - name: Prepare compile script
        run: bash .forgejo/scripts/write_compile_script.sh '${{ steps.meta.outputs.mpr }}' '${{ steps.meta.outputs.tag }}'

      - name: Compile MDA
        uses: docker://private-cloud.registry.mendix.com/mxbuild:${{ steps.meta.outputs.version }}
        with:
          entrypoint: /bin/sh
          args: ./compile.sh

      - name: Build and push
        id: image
        env:
          REGISTRY: ${{ vars.REGISTRY }}
          APP: ${{ github.event.repository.name }}
          TAG: ${{ steps.meta.outputs.tag }}
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          DOCKER_CONFIG: /kaniko/.docker
          ROOTFS_APP: ${{ vars.ROOTFS_APP_IMAGE }}
          ROOTFS_BUILDER: ${{ vars.ROOTFS_BUILDER_IMAGE }}
          CORRELATION: ${{ steps.open.outputs.correlation }}
          SHA: ${{ github.sha }}
        run: bash .forgejo/scripts/build_push.sh

  lint:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: *repo-checkout
      - name: mxlint
        env:
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: bash .forgejo/scripts/lint.sh

  unit-test:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Unit test
        env:
          MXRUNTIME_DatabaseType: HSQLDB
          MXRUNTIME_DatabaseName: testing
          MXRUNTIME_DatabaseJdbcUrl: jdbc:hsqldb:mem:testing
          NON_MENDIX_PUBLIC_CLOUD: "true"
          MX_UnitTesting_Enabled: "true"
          MX_UnitTesting_RemoteApiEnabled: "true"
          MX_UnitTesting_RemoteApiPassword: ${{ secrets.UNIT_TEST_PASSWORD }}
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: bash "/srv/shared/${CORRELATION}/ci/unit_test.sh"

  scan:
    needs: build
    runs-on: lowops
    continue-on-error: true
    container:
      image: aquasec/trivy:0.63.0
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Trivy
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
          CORRELATION: ${{ needs.build.outputs.correlation }}
        run: |
          set -eu
          set +e
          trivy image --username "$HARBOR_USERNAME" --password "$HARBOR_PASSWORD" \
            --format json --output scan-result.json --timeout 15m "${{ needs.build.outputs.image }}"
          status=$?
          set -e
          if [ -f scan-result.json ] && [ -n "${CORRELATION:-}" ]; then
            mkdir -p "/srv/shared/${CORRELATION}"
            cp scan-result.json "/srv/shared/${CORRELATION}/scan-result.json"
          fi
          exit "$status"

  notify:
    needs: [build, lint, unit-test, scan]
    if: always()
    runs-on: lowops
    container:
      image: ${{ vars.TOOLKIT_IMAGE }}
      volumes:
        - /srv/shared:/srv/shared
    steps:
      - name: Checkout
        env:
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: *repo-checkout
      - name: Publish build result
        env:
          APP: ${{ github.event.repository.name }}
          COMMIT: ${{ github.sha }}
          REQUESTER: user/${{ github.actor }}
          CORRELATION: ${{ needs.build.outputs.correlation }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ needs.build.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
          RABBITMQ_HOST: ${{ vars.RABBITMQ_HOST }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          MINIO_URL: ${{ vars.MINIO_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          CORE_BUCKET: ${{ vars.CORE_BUCKET }}
          LOWOPS_UNIT_TEST_FILE: results.json
          LOWOPS_INCLUDE_MDA: "true"
        run: python .forgejo/scripts/publish_build.py
